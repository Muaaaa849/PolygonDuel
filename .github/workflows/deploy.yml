name: CI & Pages

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Frame rules, combos, netcode, determinism
        run: npx vitest run
      - name: Build
        run: npx vite build
      - uses: actions/upload-pages-artifact@v3
        if: github.ref_name == github.event.repository.default_branch && github.event_name != 'pull_request'
        with:
          path: dist

  deploy:
    needs: test
    if: github.ref_name == github.event.repository.default_branch && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
